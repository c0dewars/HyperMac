name: macOS build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build (macos-15)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test core and build native app
        run: bash scripts/build.sh --test
      - name: Run lifecycle and geometry regressions
        run: |
          swiftc Sources/HyperMacCore/*.swift scripts/check-shortcuts.swift -o "$RUNNER_TEMP/hypermac-checks"
          "$RUNNER_TEMP/hypermac-checks"
          swiftc Sources/HyperMacCore/*.swift scripts/check-layouts.swift -o "$RUNNER_TEMP/hypermac-layout-checks"
          "$RUNNER_TEMP/hypermac-layout-checks"
      - name: Verify test bundle
        run: |
          codesign --verify --strict dist/HyperMac.app
          plutil -lint dist/HyperMac.app/Contents/Info.plist
          bash -n scripts/*.sh
      - name: Verify Apple Silicon preview packaging
        run: bash scripts/package-dmg.sh
